name: publish

# Publishes the image to GHCR, the registry mm_videos_server's Kamal deploy already uses.
# No new secrets: it logs in with this repo's GITHUB_TOKEN.
#
#   push to main  → ghcr.io/musicmaniacs/musicbrainz-bot:main and :sha-<commit>
#   tag v*        → ghcr.io/musicmaniacs/musicbrainz-bot:<tag> (e.g. v0.1.0) and :latest
#
# The deploy pins a version tag, never :latest or :main.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/musicmaniacs/musicbrainz-bot

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # The production server is amd64 (same as mm_videos_server's `builder.arch`).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
